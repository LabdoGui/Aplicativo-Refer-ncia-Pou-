name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Conferir a formatação (Prettier)
        run: npm run format:check

      - name: Compilar bibliotecas, serviços, gateway e frontend
        run: npm run build

      - name: Rodar os testes
        run: npm test

  docker:
    name: Imagens Docker, smoke test e jornada E2E
    # Em pull requests, em push na main e na execução manual. É a única etapa que
    # sobe os processos de verdade (módulos Nest, banco, broker e nginx), então erros
    # de configuração e inicialização aparecem antes do merge. Pushes em outros
    # ramos ficam de fora: o build das 8 imagens é a etapa mais demorada.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # As jornadas e a matriz de autorização fazem centenas de requisições (e
      # dezenas de logins) do mesmo IP em poucos minutos: acima dos limites de
      # produção (300 por minuto no geral, 20 nas rotas de senha).
      RATE_LIMIT_MAX: 5000
      AUTH_RATE_LIMIT_MAX: 200
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node.js 22 (smoke test e jornada E2E)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Validar o docker-compose.yml
        run: docker compose config -q

      - name: Construir as imagens
        run: docker compose build

      - name: Subir o ambiente completo
        run: docker compose up -d --wait --wait-timeout 180

      - name: Smoke test pelo nginx
        run: node scripts/smoke.mjs --timeout=120

      # Os 22 passos do critério de aceite pela API real (cadastro → agendamento →
      # atendimento → doação → pontos → documento → dashboard e estoque).
      - name: Jornada E2E (22 passos)
        run: node scripts/e2e-journey.mjs

      # Cada papel contra as rotas de todos os serviços, IDOR e token adulterado.
      - name: Matriz de autorização
        run: node scripts/authz-matrix.mjs

      # Os mesmos 22 passos clicando nas telas (Playwright + Chromium), sem erros no console.
      - name: Instalar o Playwright
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Jornada E2E pelo navegador (22 passos)
        run: npm run e2e:ui
        env:
          E2E_SCREENSHOTS: e2e-ui-capturas

      - name: Capturas da jornada pelo navegador (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ui-capturas
          path: e2e-ui-capturas
          if-no-files-found: ignore

      - name: Estado e logs dos contêineres (em caso de falha)
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200

      - name: Derrubar o ambiente
        if: always()
        run: docker compose down -v

  demo:
    name: Demonstração no navegador (jornada E2E)
    # A demonstração roda o mesmo front-end com um servidor simulado na página
    # (frontend/src/demo). Sem Docker: só o build de arquivo único e os 22 passos.
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências e o Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Construir a demonstração (arquivo único)
        run: npm run build:demo -w @pulso/frontend

      - name: Servir a demonstração
        working-directory: frontend
        run: |
          nohup npx vite preview --mode demo --port 4173 --strictPort > /tmp/vite-preview.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:4173/demo.html > /dev/null && exit 0; sleep 1; done
          cat /tmp/vite-preview.log
          exit 1

      - name: Jornada E2E pelo navegador na demonstração (22 passos)
        run: npm run e2e:ui
        env:
          BASE_URL: http://localhost:4173/demo.html
          E2E_SCREENSHOTS: e2e-demo-capturas

      - name: Capturas da jornada na demonstração (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-demo-capturas
          path: e2e-demo-capturas
          if-no-files-found: ignore
