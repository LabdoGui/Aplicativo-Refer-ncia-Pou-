# Pulso — ambiente completo em contêineres.
#
#   docker compose up --build        → http://localhost:8080
#   npm run infra:up                 → só PostgreSQL e RabbitMQ (desenvolvimento local)
#
# Todas as variáveis têm valor padrão de desenvolvimento: o arquivo .env é
# opcional (veja .env.example). Troque os segredos fora do ambiente acadêmico.
name: pulso

# ---------------------------------------------------------------------------
# Blocos reutilizados (âncoras YAML)
# ---------------------------------------------------------------------------
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-node-build-args: &node-build-args
  NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}

# Configuração comum a todos os processos NestJS (gateway e serviços).
x-backend: &backend
  restart: unless-stopped
  init: true
  logging: *logging
  healthcheck:
    test: ['CMD-SHELL', 'wget -q -T 4 -O /dev/null http://127.0.0.1:$${PORT}/health || exit 1']
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 40s

x-backend-env: &backend-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-pulso-dev-internal-token-troque-em-producao}
  JWKS_URL: http://identity:3001/api/v1/.well-known/jwks.json

# Serviço de domínio: banco + broker, só sobe com os dois saudáveis.
x-service: &service
  <<: *backend
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

x-service-env: &service-env
  <<: *backend-env
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-pulso}:${RABBITMQ_PASSWORD:-pulso_dev}@rabbitmq:5672
  # Migrações aplicadas no boot de cada serviço e dados fictícios de demonstração
  # gravados quando o banco está vazio (ambiente acadêmico).
  RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
  # Endereços internos para as chamadas /internal entre serviços.
  IDENTITY_URL: http://identity:3001
  SCHEDULING_URL: http://scheduling:3002
  CLINICAL_URL: http://clinical:3003

x-service-build: &service-build
  context: .
  dockerfile: docker/service.Dockerfile

services:
  # -------------------------------------------------------------------------
  # Infraestrutura
  # -------------------------------------------------------------------------
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulso_dev}
      POSTGRES_DB: ${POSTGRES_DB:-pulso}
      # Lidas por database/init/01-init.sh (um usuário e um schema por serviço).
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_dev_password}
      SCHEDULING_DB_PASSWORD: ${SCHEDULING_DB_PASSWORD:-scheduling_dev_password}
      CLINICAL_DB_PASSWORD: ${CLINICAL_DB_PASSWORD:-clinical_dev_password}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory_dev_password}
      ENGAGEMENT_DB_PASSWORD: ${ENGAGEMENT_DB_PASSWORD:-engagement_dev_password}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    # TCP (-h 127.0.0.1): durante os scripts de init o servidor temporário só
    # escuta no socket local, então o contêiner não fica saudável antes da hora.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:3.13-management-alpine}
    restart: unless-stopped
    logging: *logging
    # Nome fixo: o RabbitMQ guarda os dados por nome de nó (rabbit@<hostname>).
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pulso}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pulso_dev}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    ports:
      - '127.0.0.1:${RABBITMQ_PORT:-5672}:5672'
      - '127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672'

  # -------------------------------------------------------------------------
  # Serviços de domínio (portas no host só em 127.0.0.1, para o Swagger de cada um)
  # -------------------------------------------------------------------------
  identity:
    <<: *service
    image: pulso/identity:dev
    build:
      <<: *service-build
      args:
        <<: *node-build-args
        SERVICE_DIR: backend/services/identity
        SERVICE_PORT: 3001
    environment:
      <<: *service-env
      PORT: 3001
      DATABASE_URL: postgresql://identity_app:${IDENTITY_DB_PASSWORD:-identity_dev_password}@postgres:5432/${POSTGRES_DB:-pulso}?schema=identity
      FIELD_ENCRYPTION_KEY: ${IDENTITY_FIELD_ENCRYPTION_KEY:-cHVsc28tZGV2LWlkZW50aXR5LWtleS0zMmJ5dGVzISE=}
      JWT_KEYS_DIR: /var/lib/pulso/identity-keys
      # Em produção (HTTPS) use true. Com http na rede local, o navegador recusaria o cookie Secure.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - identity-keys:/var/lib/pulso/identity-keys
    ports:
      - '127.0.0.1:3001:3001'

  scheduling:
    <<: *service
    image: pulso/scheduling:dev
    build:
      <<: *service-build
      args:
        <<: *node-build-args
        SERVICE_DIR: backend/services/scheduling
        SERVICE_PORT: 3002
    environment:
      <<: *service-env
      PORT: 3002
      DATABASE_URL: postgresql://scheduling_app:${SCHEDULING_DB_PASSWORD:-scheduling_dev_password}@postgres:5432/${POSTGRES_DB:-pulso}?schema=scheduling
    ports:
      - '127.0.0.1:3002:3002'

  clinical:
    <<: *service
    image: pulso/clinical:dev
    build:
      <<: *service-build
      args:
        <<: *node-build-args
        SERVICE_DIR: backend/services/clinical
        SERVICE_PORT: 3003
    environment:
      <<: *service-env
      PORT: 3003
      DATABASE_URL: postgresql://clinical_app:${CLINICAL_DB_PASSWORD:-clinical_dev_password}@postgres:5432/${POSTGRES_DB:-pulso}?schema=clinical
      FIELD_ENCRYPTION_KEY: ${CLINICAL_FIELD_ENCRYPTION_KEY:-cHVsc28tZGV2LWNsaW5pY2FsLWtleS0zMmJ5dGVzISE=}
    ports:
      - '127.0.0.1:3003:3003'

  inventory:
    <<: *service
    image: pulso/inventory:dev
    build:
      <<: *service-build
      args:
        <<: *node-build-args
        SERVICE_DIR: backend/services/inventory
        SERVICE_PORT: 3004
    environment:
      <<: *service-env
      PORT: 3004
      DATABASE_URL: postgresql://inventory_app:${INVENTORY_DB_PASSWORD:-inventory_dev_password}@postgres:5432/${POSTGRES_DB:-pulso}?schema=inventory
    ports:
      - '127.0.0.1:3004:3004'

  engagement:
    <<: *service
    image: pulso/engagement:dev
    build:
      <<: *service-build
      args:
        <<: *node-build-args
        SERVICE_DIR: backend/services/engagement
        SERVICE_PORT: 3005
    environment:
      <<: *service-env
      PORT: 3005
      DATABASE_URL: postgresql://engagement_app:${ENGAGEMENT_DB_PASSWORD:-engagement_dev_password}@postgres:5432/${POSTGRES_DB:-pulso}?schema=engagement
    ports:
      - '127.0.0.1:3005:3005'

  notification:
    <<: *service
    image: pulso/notification:dev
    build:
      <<: *service-build
      args:
        <<: *node-build-args
        SERVICE_DIR: backend/services/notification
        SERVICE_PORT: 3006
    environment:
      <<: *service-env
      PORT: 3006
      DATABASE_URL: postgresql://notification_app:${NOTIFICATION_DB_PASSWORD:-notification_dev_password}@postgres:5432/${POSTGRES_DB:-pulso}?schema=notification
    ports:
      - '127.0.0.1:3006:3006'

  # -------------------------------------------------------------------------
  # Borda: gateway e frontend (nginx)
  # -------------------------------------------------------------------------
  gateway:
    <<: *backend
    image: pulso/gateway:dev
    build:
      <<: *service-build
      args:
        <<: *node-build-args
        SERVICE_DIR: backend/gateway
        SERVICE_PORT: 3000
    environment:
      <<: *backend-env
      PORT: 3000
      IDENTITY_URL: http://identity:3001
      SCHEDULING_URL: http://scheduling:3002
      CLINICAL_URL: http://clinical:3003
      INVENTORY_URL: http://inventory:3004
      ENGAGEMENT_URL: http://engagement:3005
      NOTIFICATION_URL: http://notification:3006
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
    # O gateway sobe junto e informa "degraded" em /api/v1/health/services
    # enquanto algum serviço ainda está iniciando.
    depends_on:
      identity:
        condition: service_started
      scheduling:
        condition: service_started
      clinical:
        condition: service_started
      inventory:
        condition: service_started
      engagement:
        condition: service_started
      notification:
        condition: service_started
    ports:
      - '127.0.0.1:${GATEWAY_PORT:-3000}:3000'

  frontend:
    image: pulso/frontend:dev
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        <<: *node-build-args
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    logging: *logging
    depends_on:
      gateway:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -T 3 -O /dev/null http://127.0.0.1:8080/healthz || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - '${FRONTEND_PORT:-8080}:8080'

volumes:
  pgdata:
  rabbitmq-data:
  # Par de chaves RSA do JWT: recriar o contêiner não derruba as sessões.
  identity-keys:
