# nginx do Pulso: serve a SPA (frontend/dist) e encaminha /api/ ao gateway.
# Roda sem root (usuário nginx), por isso o pid e os arquivos temporários ficam em /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;
  server_tokens off;
  absolute_redirect off;

  # Id de correlação: reaproveita o X-Request-Id do cliente (se tiver formato
  # seguro) ou usa o id gerado pelo nginx. Ele segue até os serviços e os logs.
  map $http_x_request_id $pulso_request_id {
    "~^[A-Za-z0-9._:-]{8,128}$" $http_x_request_id;
    default $request_id;
  }

  # Content-Security-Policy só para a SPA: as respostas de /api/ (inclusive o
  # Swagger UI em /api/docs) não recebem esta política. Valor vazio = sem cabeçalho.
  # As fontes são auto-hospedadas (assets/), então nada é carregado de outra origem.
  map $uri $pulso_csp {
    "~^/api/" "";
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'";
  }

  # Arquivos com hash no nome (assets/) são imutáveis; o index.html é sempre revalidado.
  # A API define o próprio cache.
  map $uri $pulso_cache_control {
    "~^/api/" "";
    "~^/assets/" "public, max-age=31536000, immutable";
    default "no-cache";
  }

  log_format pulso escape=json
    '{"time":"$time_iso8601","requestId":"$pulso_request_id","remoteAddr":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"requestTime":$request_time,'
    '"upstreamTime":"$upstream_response_time","userAgent":"$http_user_agent"}';
  access_log /dev/stdout pulso;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json
    application/problem+json application/manifest+json image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Cabeçalhos de segurança de todas as respostas. Nenhum location usa add_header,
    # então todos herdam estes (o add_header de um location anularia a herança).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Content-Security-Policy $pulso_csp always;
    add_header Cache-Control $pulso_cache_control;

    # API: tudo em /api/ vai para o gateway com o caminho original.
    location /api/ {
      # Mesmo limite do back-end (REQUEST_BODY_LIMIT = 1 MB em @pulso/common).
      client_max_body_size 1m;

      # DNS interno do Docker, resolvido a cada requisição: se o gateway for
      # recriado com outro IP, o nginx continua encontrando-o.
      resolver 127.0.0.11 valid=10s ipv6=off;
      resolver_timeout 5s;
      set $pulso_gateway http://gateway:3000;
      proxy_pass $pulso_gateway;

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # O nginx é a borda: substitui (não concatena) o X-Forwarded-For enviado
      # pelo cliente, para que ninguém falsifique o IP usado no rate limit.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $pulso_request_id;

      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;

      # O gateway (helmet) também envia estes cabeçalhos; ficam só os do nginx.
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header X-Frame-Options;

      # Erros gerados pelo próprio nginx, no formato da API (RFC 9457). As respostas
      # de erro do gateway passam sem alteração (proxy_intercept_errors está desligado).
      # Gateway fora do ar ou iniciando:
      error_page 502 503 504 = @gateway_unavailable;
      # Corpo acima de client_max_body_size:
      error_page 413 = @payload_too_large;
    }

    location @gateway_unavailable {
      default_type application/problem+json;
      return 503 '{"type":"https://pulso.local/problems/service-unavailable","title":"Serviço indisponível","status":503,"detail":"A API do Pulso está iniciando ou temporariamente indisponível. Tente novamente em instantes.","code":"SERVICE_UNAVAILABLE","requestId":"$pulso_request_id"}';
    }

    location @payload_too_large {
      default_type application/problem+json;
      return 413 '{"type":"https://pulso.local/problems/payload-too-large","title":"Conteúdo grande demais","status":413,"detail":"O conteúdo enviado é grande demais. O limite é de 1 MB.","code":"PAYLOAD_TOO_LARGE","requestId":"$pulso_request_id"}';
    }

    # Health check do contêiner (sem poluir o log de acesso).
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Arquivos estáticos com hash: se não existir, 404 (nunca o index.html).
    location /assets/ {
      try_files $uri =404;
      access_log off;
    }

    # SPA: qualquer outra rota devolve o index.html e o React Router decide.
    location / {
      charset utf-8;
      try_files $uri /index.html;
    }
  }
}
